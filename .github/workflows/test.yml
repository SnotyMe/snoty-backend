name: Test
on:
  pull_request:
    types: [opened, reopened]
  push:
permissions:
  checks: write
jobs:
  test:
    name: Build and run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run tests
        run: ./gradlew check koverXmlReport

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: '**/build/test-results/*/TEST-*.xml'

      - name: Upload Test Results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: '**build/test-results/**/TEST-*.xml'

      - name: Upload Coverage Report
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build docker image
        run: |
          branch="${GITHUB_REF#refs/heads/}"
          branch_tag="${branch//\//-}"
          sha_short="${GITHUB_SHA::7}"

          ./gradlew \
            -Pme.snoty.docker.image="ghcr.io/snotyme/snoty-backend-snapshot" \
            -Pme.snoty.docker.tags="${branch_tag}-${sha_short}" \
            -Pme.snoty.github.run="${{github.run_id}}:${{github.run_number}}" \
            build jibDockerBuild

      - name: Push docker image
        run: docker push --all-tags ghcr.io/snotyme/snoty-backend-snapshot
